<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>CSS Styling</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.15.1/beautify.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.15.1/beautify-css.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.15.1/beautify-html.js"></script>
    <style>
        #buttonPanel {
            display: flex;
            gap: 10px;
            width: 100%;
            justify-content: space-between;
            background-color: #2b2a2a;
            box-sizing: border-box;
            padding: 10px 15px 15px 15px;
        }

        .button {
            padding: 10px 20px;
            cursor: pointer;
        }

        body {
            padding: 80px 40px 40px 40px;
            background-color: #201f1f;
        }

        #htmlPreview textarea {
            border: none;
            padding: 20px;
        }

        #cssEditor {
            border: none;
            border-left: 1px solid #dfdfdf;
            background-color: #3e3e3e;
            color: #adb6ff;
            padding: 20px;
            font-size: 13px;
        }

        #copyHtmlButton {
            position: relative;
            left: -82px;
        }

        #toggleButton,
        #copyHtmlButton,
        #copyCssButton {
            background-color: #3080F6;
            border: none !important;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            outline: none;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            /* Subtle shadow */
            transition: all 0.3s ease;
        }

        #toggleButton:hover,
        #copyHtmlButton:hover,
        #copyCssButton:hover {
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.5);
            /* More pronounced shadow on hover */
            transform: translateY(-2px);
            /* Slight lift effect */
        }

        #htmlPreview {
            background-color: white;
            padding: 20px;
            box-sizing: border-box;
        }
    </style>
</head>

<body>
    <div id="buttonPanel">
        <button id="toggleButton" class="button">Show Code</button>
        <button id="copyHtmlButton" class="button">Copy HTML</button>
        <button id="copyCssButton" class="button" style="position: fixed; right: 20px; top: 11px;">Copy CSS</button>
    </div>
    <div style="display: flex; height: 100vh;">
        <div id="htmlPreview" style="width: 50%; overflow: auto;"></div>
        <textarea id="cssEditor" style="width: 50%;"></textarea>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var htmlPreview = document.getElementById('htmlPreview');
            var cssEditor = document.getElementById('cssEditor');
            var toggleButton = document.getElementById('toggleButton');
            var copyHtmlButton = document.getElementById('copyHtmlButton');
            var copyCssButton = document.getElementById('copyCssButton');
            var styleTag = document.createElement('style');
            document.head.appendChild(styleTag);
            var isCodeView = false;
            var rawHTML = localStorage.getItem('renderedHTML') || ''; // Store raw HTML

            if (rawHTML) {
                htmlPreview.innerHTML = tidyHTML(rawHTML); // Display beautified HTML initially
            }

            var savedCSS = localStorage.getItem('lastCss');
            if (savedCSS) {
                cssEditor.value = savedCSS;
                styleTag.innerHTML = savedCSS;
            }

            cssEditor.addEventListener('input', function () {
                styleTag.innerHTML = cssEditor.value;
                localStorage.setItem('lastCss', cssEditor.value);
            });

            function tidyHTML(html) {
                return html_beautify(html, {
                    indent_size: 4,
                    indent_inner_html: true,
                    wrap_line_length: 80,
                    unformatted: [],
                    extra_liners: []
                }).replace(/(<input [^>]*>)/g, '\n$1\n');
            }

            function contentChanged(oldContent, newContent) {
                return oldContent.replace(/\s/g, '') !== newContent.replace(/\s/g, '');
            }

            toggleButton.addEventListener('click', function () {
                if (!isCodeView) {
                    var htmlCode = document.createElement('textarea');
                    htmlCode.style.width = '100%';
                    htmlCode.style.height = '100%';
                    htmlCode.value = tidyHTML(rawHTML); // Beautify raw HTML for editing
                    htmlPreview.innerHTML = '';
                    htmlPreview.appendChild(htmlCode);
                    toggleButton.textContent = 'Show Preview';
                } else {
                    var editedHTML = htmlPreview.querySelector('textarea').value;
                    if (contentChanged(rawHTML, editedHTML)) {
                        rawHTML = editedHTML; // Update raw HTML only if changed
                    }
                    htmlPreview.innerHTML = tidyHTML(rawHTML); // Beautify and display updated raw HTML
                    localStorage.setItem('renderedHTML', rawHTML); // Save raw HTML
                    toggleButton.textContent = 'Show Code';
                }
                isCodeView = !isCodeView;
            });

            copyHtmlButton.addEventListener('click', function () {
                if (isCodeView) { // Only allow copying if in code view
                    var htmlTextArea = htmlPreview.querySelector('textarea');
                    htmlTextArea.select();
                    document.execCommand('copy');
                }
            });

            copyCssButton.addEventListener('click', function () {
                cssEditor.select();
                document.execCommand('copy');
            });
        });
    </script>
</body>

</html>
