<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>CSS Styling</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/css/bootstrap.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.15.1/beautify.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.15.1/beautify-css.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.15.1/beautify-html.js"></script>
    <style>
        #buttonPanel {
            display: flex;
            gap: 10px;
            width: 100%;
            justify-content: space-between;
            background-color: #2b2a2a;
            box-sizing: border-box;
            padding: 15px;
        }

        .button {
            padding: 10px 20px;
            cursor: pointer;
        }

        body {
            padding: 80px 40px 40px 40px;
            background-color: #201f1f;
        }

        #htmlPreview textarea {
            border: none;
            padding: 20px;
        }

        #cssEditor {
            border: none;
            border-left: 1px solid #dfdfdf;
            background-color: #232222;
            color: #adb6ff;
            padding: 20px;
            font-size: 13px;
        }

        #copyHtmlButton {
            position: relative;
            left: -82px;
        }

        #toggleButton,
        #copyHtmlButton,
        #copyCssButton {
            background-color: #3080F6;
            border: none !important;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            outline: none;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            /* Subtle shadow */
            transition: all 0.3s ease;
        }

        #toggleButton:hover,
        #copyHtmlButton:hover,
        #copyCssButton:hover {
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.5);
            /* More pronounced shadow on hover */
            transform: translateY(-2px);
            /* Slight lift effect */
        }

        #htmlPreview {
            background-color: white;
            padding: 20px;
            box-sizing: border-box;
        }
    </style>
</head>

<body>

    <!-- Add an overlay div in your HTML that will be used to show the element information -->
    <div id="inspectorOverlay"
        style="position: fixed; pointer-events: none; display: none; border: 1px solid blue; z-index: 9999;"></div>
    <div id="infoBox"
        style="position: fixed; display: none; background: white; border: 1px solid black; padding: 5px; z-index: 10000;">
    </div>
    <!--End of Inspector Overlay Feature-->

    <div id="buttonPanel">
        <button id="toggleButton" class="button">Show Code</button>
        <button id="inspectorModeToggle" class="button">Toggle Inspector Mode</button>
        <button id="copyHtmlButton" class="button">Copy HTML</button>
        <button id="copyCssButton" class="button">Copy CSS</button>
    </div>
    <div style="display: flex; height: 100vh;">
        <div id="htmlPreview" style="width: 50%; overflow: auto;"></div>
        <textarea id="cssEditor" style="width: 50%;"></textarea>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var htmlPreview = document.getElementById('htmlPreview');
            var cssEditor = document.getElementById('cssEditor');
            var toggleButton = document.getElementById('toggleButton');
            var copyHtmlButton = document.getElementById('copyHtmlButton');
            var copyCssButton = document.getElementById('copyCssButton');
            var styleTag = document.createElement('style');
            document.head.appendChild(styleTag);
            var isCodeView = false;
            var rawHTML = localStorage.getItem('renderedHTML') || ''; // Store raw HTML

            if (rawHTML) {
                htmlPreview.innerHTML = tidyHTML(rawHTML); // Display beautified HTML initially
            }

            var savedCSS = localStorage.getItem('lastCss');
            if (savedCSS) {
                cssEditor.value = savedCSS;
                styleTag.innerHTML = savedCSS;
            }

            cssEditor.addEventListener('input', function () {
                styleTag.innerHTML = cssEditor.value;
                localStorage.setItem('lastCss', cssEditor.value);
            });

            function tidyHTML(html) {
                return html_beautify(html, {
                    indent_size: 4,
                    indent_inner_html: true,
                    wrap_line_length: 80,
                    unformatted: [],
                    extra_liners: []
                }).replace(/(<input [^>]*>)/g, '\n$1\n');
            }

            function contentChanged(oldContent, newContent) {
                return oldContent.replace(/\s/g, '') !== newContent.replace(/\s/g, '');
            }

            toggleButton.addEventListener('click', function () {
                if (!isCodeView) {
                    var htmlCode = document.createElement('textarea');
                    htmlCode.style.width = '100%';
                    htmlCode.style.height = '100%';
                    htmlCode.value = tidyHTML(rawHTML); // Beautify raw HTML for editing
                    htmlPreview.innerHTML = '';
                    htmlPreview.appendChild(htmlCode);
                    toggleButton.textContent = 'Show Preview';
                } else {
                    var editedHTML = htmlPreview.querySelector('textarea').value;
                    if (contentChanged(rawHTML, editedHTML)) {
                        rawHTML = editedHTML; // Update raw HTML only if changed
                    }
                    htmlPreview.innerHTML = tidyHTML(rawHTML); // Beautify and display updated raw HTML
                    localStorage.setItem('renderedHTML', rawHTML); // Save raw HTML
                    toggleButton.textContent = 'Show Code';
                }
                isCodeView = !isCodeView;
            });

            copyHtmlButton.addEventListener('click', function () {
                if (isCodeView) { // Only allow copying if in code view
                    var htmlTextArea = htmlPreview.querySelector('textarea');
                    htmlTextArea.select();
                    document.execCommand('copy');
                }
            });

            copyCssButton.addEventListener('click', function () {
                cssEditor.select();
                document.execCommand('copy');
            });
        });

        //Below is for Update 011 Where we are now giving the option to turn on inspector and see elements breadcrumbs for easier styling and allow freezing the current overlay on click and release on second
        document.addEventListener('DOMContentLoaded', function () {
            var isInspectorActive = false;
            var isFrozen = false;
            var overlay = document.getElementById('inspectorOverlay');
            var infoBox = document.getElementById('infoBox');
            var inspectorButton = document.getElementById('inspectorModeToggle');

            inspectorButton.addEventListener('click', function () {
                isInspectorActive = !isInspectorActive; // Toggle inspector mode
                this.textContent = isInspectorActive ? "Disable Inspector Mode" :
                    "Enable Inspector Mode";
                if (!isInspectorActive) {
                    overlay.style.display = 'none'; // Hide overlay when inspector is deactivated
                    infoBox.style.display = 'none';
                    isFrozen = false; // Reset freeze state
                }
            });

            document.addEventListener('mousemove', function (e) {
                if (!isInspectorActive || isFrozen) return;
                updateOverlay(e.target);
            });

            document.addEventListener('click', function (e) {
                if (!isInspectorActive || e.target === inspectorButton) return;
                if (isFrozen && e.target === overlay) {
                    isFrozen = false;
                    overlay.style.display = 'none';
                    infoBox.style.display = 'none';
                } else if (!isFrozen) {
                    isFrozen = true;
                    updateOverlay(e.target);
                }
            });

            function updateOverlay(targetElement) {
                var rect = targetElement.getBoundingClientRect();
                overlay.style.display = 'block';
                overlay.style.top = rect.top + window.scrollY + 'px';
                overlay.style.left = rect.left + window.scrollX + 'px';
                overlay.style.width = targetElement.offsetWidth + 'px';
                overlay.style.height = targetElement.offsetHeight + 'px';

                infoBox.style.display = 'block';
                infoBox.style.top = (rect.top + window.scrollY + targetElement.offsetHeight + 5) + 'px';
                infoBox.style.left = rect.left + window.scrollX + 'px';
                infoBox.textContent = 'Tag: ' + targetElement.tagName + ', Class: ' + targetElement.className +
                    ', ID: ' + targetElement.id;
            }
        });
    </script>
</body>

</html>
