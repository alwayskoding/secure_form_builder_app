        /* Flexbox setup for control groups within the styling panel */
        #stylingPanel .spacing-control,
        #stylingPanel .form-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Labels for better visibility within the styling panel */
        #stylingPanel .spacing-control label,
        #stylingPanel .form-group label {
            margin-bottom: 5px;
            font-size: 14px;
        }

        /* Grid setup for input controls within the styling panel */
        #stylingPanel .inputs,
        #stylingPanel .form-group {
            display: flex !important;
            flex-direction: column;
            gap: 5px;
        }

        /* Styling for input elements within the styling panel */
        #stylingPanel .inputs input,

        /*Custom Dropdowns Were Created In Place of Selects For Custom Styling*/
        .custom-dropdown {
            position: relative;
            font-family: Arial, sans-serif;
            width: 100%;
            /* Ensures the dropdown takes full width of its container */
        }

        .dropdown-selected {
            background-color: DodgerBlue;
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            user-select: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left-color: var(--colors-border-1);
            border-right-color: var(--colors-border-1);
            border-top-color: var(--colors-border-1);
            outline: 0px;
            cursor: default;
            -webkit-user-select: none;
            color: var(--colors-text-active);
            padding: 0px 4px 0px 8px;
            box-sizing: border-box;
            height: 24px;
            border-radius: 4px;
            background: var(--colors-action-secondary-background);
            border-width: 0px;
            border-style: solid;
            box-shadow: var(--box-shadows-action-secondary);
        }

        .dropdown-selected:after {
            content: "\25BC";
            /* Unicode character for downward arrow */
            font-size: 12px;
            color: white;
            padding-left: 10px;
        }

        .dropdown-options {
            /* Match width to parent */
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            /* Adds shadow to dropdown */
            display: none;
            /* Initially hide the dropdown options */
            top: -540px;
            left: 0;
            width: 130px;
            height: 100vh;
            opacity: 100;
            background-color: var(--colors-background-3);
            border-color: var(--colors-border-2);
            border-radius: 4px;
            transform: translate3d(0px, 549px, 0px);
            position: relative;
            overflow: hidden;
        }

        .dropdown-option {
            padding: 8px 16px;
            color: white;
            cursor: pointer;
            user-select: none;
        }

        .dropdown-option:hover,
        .dropdown-option:active {
            background-color: rgba(255, 255, 255, 0.3);
        }

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var htmlPreview = document.getElementById('htmlPreview');
            var cssEditor = document.getElementById('cssEditor');
            var toggleButton = document.getElementById('toggleButton');
            var copyHtmlButton = document.getElementById('copyHtmlButton');
            var copyCssButton = document.getElementById('copyCssButton');
            var styleTag = document.createElement('style');
            styleTag.id = 'editorStyles'; // Assign an ID to the style tag for the CSS editor
            document.head.appendChild(styleTag);
            var isCodeView = false;
            var rawHTML = localStorage.getItem('renderedHTML') || ''; // Store raw HTML

            if (rawHTML) {
                htmlPreview.innerHTML = tidyHTML(rawHTML); // Display beautified HTML initially
            }

            var savedCSS = localStorage.getItem('lastCss');
            if (savedCSS) {
                cssEditor.value = savedCSS;
                styleTag.innerHTML = savedCSS;
            }

            cssEditor.addEventListener('input', function () {
                styleTag.innerHTML = cssEditor.value;
                localStorage.setItem('lastCss', cssEditor.value);
            });

            function tidyHTML(html) {
                return html_beautify(html, {
                    indent_size: 4,
                    indent_inner_html: true,
                    wrap_line_length: 80,
                    unformatted: [],
                    extra_liners: []
                }).replace(/(<input [^>]*>)/g, '\n$1\n');
            }

            function contentChanged(oldContent, newContent) {
                return oldContent.replace(/\s/g, '') !== newContent.replace(/\s/g, '');
            }

            toggleButton.addEventListener('click', function () {
                if (!isCodeView) {
                    var htmlCode = document.createElement('textarea');
                    htmlCode.style.width = '100%';
                    htmlCode.style.height = '100%';
                    htmlCode.value = tidyHTML(rawHTML); // Beautify raw HTML for editing
                    htmlPreview.innerHTML = '';
                    htmlPreview.appendChild(htmlCode);
                    toggleButton.textContent = 'Show Preview';
                } else {
                    var editedHTML = htmlPreview.querySelector('textarea').value;
                    if (contentChanged(rawHTML, editedHTML)) {
                        rawHTML = editedHTML; // Update raw HTML only if changed
                    }
                    htmlPreview.innerHTML = tidyHTML(rawHTML); // Beautify and display updated raw HTML
                    localStorage.setItem('renderedHTML', rawHTML); // Save raw HTML
                    toggleButton.textContent = 'Show Code';
                }
                isCodeView = !isCodeView;
            });

            copyHtmlButton.addEventListener('click', function () {
                if (isCodeView) { // Only allow copying if in code view
                    var htmlTextArea = htmlPreview.querySelector('textarea');
                    htmlTextArea.select();
                    document.execCommand('copy');
                }
            });



            //CLEAN UPDATE: New CSS Clean UP Function That Will Take the CSS That is Grabbed When you Hit The Copy CSS Button and remove any empty values
            function cleanUpCss(cssString) {
    console.log("Original CSS:", cssString);  // Debug original CSS
    const cssRules = cssString.split("}");
    const cleanedRules = cssRules.map(rule => {
        const parts = rule.split("{");
        if (parts.length < 2) return "";
        const declarations = parts[1]
            .split(";")
            .map(decl => decl.trim())
            .filter(decl => {
                const colonIndex = decl.indexOf(":");
                if (colonIndex === -1) return false;
                const property = decl.substring(0, colonIndex).trim();
                const value = decl.substring(colonIndex + 1).trim();
                return value !== "";
            })
            .join("; ");  // Ensure all declarations are separated by a semicolon and a space
        if (declarations) {
            const cleanRule = `${parts[0].trim()} { ${declarations}; }`;  // Add a semicolon after the last declaration
            console.log("Processed Rule:", cleanRule);  // Debug each rule
            return cleanRule;
        }
        return "";
    }).filter(rule => rule !== "");

    const cleanedCss = cleanedRules.join(" ");  // Join rules with a space for readability
    console.log("Cleaned CSS:", cleanedCss);  // Debug cleaned CSS
    return cleanedCss;
}








copyCssButton.addEventListener('click', function () {
    var cssFromIndependent = document.getElementById('dynamicStylesIndependent')?.innerHTML || "";
    var cssFromGlobal = document.getElementById('dynamicStylesGlobal')?.innerHTML || "";
    var cssFromEditor = document.getElementById('editorStyles')?.innerHTML || "";

    var allCss = cssFromIndependent + "\n" + cssFromGlobal + "\n" + cssFromEditor;
    var cleanedCss = cleanUpCss(allCss); // Clean the CSS

    var temporaryTextarea = document.createElement('textarea');
    document.body.appendChild(temporaryTextarea);
    temporaryTextarea.value = cleanedCss;  // Use cleanedCss instead of allCss
    temporaryTextarea.select();
    document.execCommand('copy');
    document.body.removeChild(temporaryTextarea);

    alert('CSS copied to clipboard!');
    console.log(cleanedCss);  // Log cleanedCss instead of allCss
});

        //Below is for Update 011 Where we are now giving the option to turn on inspector and see elements breadcrumbs for easier styling and allow freezing the current overlay on click and release on second
        document.addEventListener('DOMContentLoaded', function () {
            var overlay = document.createElement('div');
            overlay.id = 'inspectorOverlay';
            document.body.appendChild(overlay);

            var infoBox = document.createElement('div');
            infoBox.id = 'infoBox';
            document.body.appendChild(infoBox);

            var htmlPreview = document.getElementById('htmlPreview'); // Get the HTML preview container

            document.body.addEventListener('mousemove', function (e) {
                // Check if the event target is inside the htmlPreview
                if (!e.target || !htmlPreview.contains(e.target) || e.target === overlay || e.target ===
                    infoBox) {
                    overlay.style.display = 'none';
                    infoBox.style.display = 'none';
                    return;
                }
                var rect = e.target.getBoundingClientRect();
                overlay.style.display = 'block';
                overlay.style.left = rect.left + window.scrollX + 'px';
                overlay.style.top = rect.top + window.scrollY + 'px';
                overlay.style.width = rect.width + 'px';
                overlay.style.height = rect.height + 'px';

                infoBox.style.display = 'block';
                infoBox.style.left = rect.left + window.scrollX + 'px';
                infoBox.style.top = rect.bottom + window.scrollY + 5 + 'px';
                infoBox.innerHTML =
                    `<strong>Tag:</strong> ${e.target.tagName.toLowerCase()}, <strong>Class:</strong> ${e.target.className}, <strong>ID:</strong> ${e.target.id}, <strong>Dimensions:</strong> ${rect.width.toFixed(1)} x ${rect.height.toFixed(1)}`;
            });

            document.body.addEventListener('click', function (e) {
                if (htmlPreview.contains(e.target)) {
                    overlay.style.display = 'none';
                    infoBox.style.display = 'none';
                }
            });
        });

        $(document).ready(function () {
            var selectedElement = null;
            var styleCache = {}; // Cache for storing styles in memory


            //Update 300 to reapply saved styles to htmlpreview if reloaded or styles change in independent style panel
            // Function to load styles from local storage
            function loadStylesFromLocalStorage() {
                var storedStyles = localStorage.getItem('centralStyleStore');
                if (storedStyles) {
                    styleCache = JSON.parse(storedStyles);
                    applyStylesToElements();
                }
            }


            // Function to apply styles to elements based on the styleCache
            function applyStylesToElements() {
                Object.keys(styleCache).forEach(function (elementId) {
                    var element = document.getElementById(elementId);
                    var styles = styleCache[elementId];
                    if (element && styles) {
                        Object.keys(styles).forEach(function (style) {
                            var cssProperty = toCssProperty(style);
                            var cssValue = appendUnitIfNeeded(cssProperty, styles[style]);
                            element.style[cssProperty] = cssValue;
                        });
                    }
                });

    <script>
        document.addEventListener('DOMContentLoaded', function () {
    var copyAllCodeButton = document.getElementById('copyAllCodeButton');

    copyAllCodeButton.addEventListener('click', function () {
        // Include Bootstrap link and custom box-sizing style
        var bootstrapLink = '<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/css/bootstrap.min.css">\n';
        var boxSizingStyle = '<style>\n.ht-legacy *, .modal * {\nbox-sizing: border-box !important;\n}\n</style>\n';

        // Get the current HTML code from the preview
        var htmlPreview = document.getElementById('htmlPreview').innerHTML;
        var rawHTML = localStorage.getItem('renderedHTML') || htmlPreview;

        // Get the existing CSS from the independent, global, and editor styles
        var cssFromIndependent = document.getElementById('dynamicStylesIndependent')?.innerHTML || "";
        var cssFromGlobal = document.getElementById('dynamicStylesGlobal')?.innerHTML || "";
        var cssFromEditor = document.getElementById('editorStyles')?.innerHTML || "";

        // Combine and clean the CSS
        var allCss = cssFromIndependent + "\n" + cssFromGlobal + "\n" + cssFromEditor;
        var cleanedCss = cleanUpCss(allCss);

        // Combine everything into the final code to be copied
        var finalCode = bootstrapLink + boxSizingStyle + '<style>\n' + cleanedCss + '</style>\n' + rawHTML;

        // Create a temporary textarea to copy the code
        var temporaryTextarea = document.createElement('textarea');
        document.body.appendChild(temporaryTextarea);
        temporaryTextarea.value = finalCode;
        temporaryTextarea.select();
        document.execCommand('copy');
        document.body.removeChild(temporaryTextarea);

        alert('All form code copied to clipboard!');
    });

    // Function to clean up CSS (same as in your existing code)
    function cleanUpCss(cssString) {
        const cssRules = cssString.split("}");
        const cleanedRules = cssRules.map(rule => {
            const parts = rule.split("{");
            if (parts.length < 2) return "";
            const declarations = parts[1]
                .split(";")
                .map(decl => decl.trim())
                .filter(decl => {
                    const colonIndex = decl.indexOf(":");
                    if (colonIndex === -1) return false;
                    const property = decl.substring(0, colonIndex).trim();
                    const value = decl.substring(colonIndex + 1).trim();
                    return value !== "";
                })
                .join("; ");
            if (declarations) {
                return `${parts[0].trim()} { ${declarations}; }`;
            }
            return "";
        }).filter(rule => rule !== "");
        return cleanedRules.join(" ");
    }
});
