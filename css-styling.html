<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Styling</title>
    <!-- Optionally include CSS editor library -->
</head>
<body>
    <div style="display: flex; height: 100vh;">
        <div id="htmlPreview" style="width: 50%; overflow: auto;"></div>
        <textarea id="cssEditor" style="width: 50%; height: 100%;"></textarea>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Retrieve the rendered HTML from localStorage
            var renderedHTML = localStorage.getItem('renderedHTML');
            if (renderedHTML) {
                document.getElementById('htmlPreview').innerHTML = renderedHTML;
                // Clear the localStorage if it's no longer needed
                localStorage.removeItem('renderedHTML');
            }

            document.getElementById('cssEditor').addEventListener('input', function() {
                // Ensure there's only one style tag
                var existingStyle = document.querySelector('#htmlPreview style');
                if (!existingStyle) {
                    var styleTag = document.createElement('style');
                    document.getElementById('htmlPreview').appendChild(styleTag);
                    existingStyle = styleTag;
                }
                existingStyle.innerHTML = this.value;
            });
        });
    </script>
</body>
</html>
