<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>CSS Styling</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.15.1/beautify.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.15.1/beautify-css.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.15.1/beautify-html.js"></script>
    <style>
        #buttonPanel {
            position: fixed;
            top: 10px;
            left: 10px;
            display: flex;
            gap: 10px;
        }

        .button {
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div style="display: flex; height: 100vh;">
        <div id="htmlPreview" style="width: 50%; overflow: auto;"></div>
        <textarea id="cssEditor" style="width: 50%; height: 100%;"></textarea>
    </div>
    <div id="buttonPanel">
        <button id="toggleButton" class="button">Show Code</button>
        <button id="tidyButton" class="button">Tidy HTML</button>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var htmlPreview = document.getElementById('htmlPreview');
            var cssEditor = document.getElementById('cssEditor');
            var toggleButton = document.getElementById('toggleButton');
            var tidyButton = document.getElementById('tidyButton');
            var styleTag = document.createElement('style');
            document.head.appendChild(styleTag); // Append style tag to head for global style management
            var isCodeView = false;

            // Load HTML and CSS from localStorage
            var savedHTML = localStorage.getItem('renderedHTML');
            var savedCSS = localStorage.getItem('lastCss');
            if (savedHTML) {
                htmlPreview.innerHTML = savedHTML;
                localStorage.removeItem('renderedHTML'); // Clear the stored HTML if needed
            }
            if (savedCSS) {
                cssEditor.value = savedCSS;
                styleTag.innerHTML = savedCSS;
            }

            cssEditor.addEventListener('input', function () {
                styleTag.innerHTML = cssEditor.value;
                localStorage.setItem('lastCss', cssEditor.value);
            });

            toggleButton.addEventListener('click', function () {
                if (!isCodeView) {
                    var htmlCode = document.createElement('textarea');
                    htmlCode.style.width = '100%';
                    htmlCode.style.height = '100%';
                    htmlCode.value = html_beautify(htmlPreview.innerHTML, {
                        indent_size: 4, // Increase or decrease based on your preference
                        indent_inner_html: true, // Indent the contents of tags for better readability
                        wrap_line_length: 80, // Sets a good standard width for readability
                        unformatted: ['b', 'i', 'u'], // List of tags to not format
                        extra_liners: [] // Keeps <head>/<body>/<html> in one line if you prefer
                    });
                    htmlPreview.innerHTML = '';
                    htmlPreview.appendChild(htmlCode);
                    toggleButton.textContent = 'Show Preview';
                } else {
                    htmlPreview.innerHTML = htmlPreview.querySelector('textarea').value;
                    localStorage.setItem('renderedHTML', htmlPreview
                    .innerHTML); // Save the rendered HTML
                    toggleButton.textContent = 'Show Code';
                }
                isCodeView = !isCodeView;
            });

            tidyButton.addEventListener('click', function () {
                if (isCodeView) {
                    var htmlTextArea = htmlPreview.querySelector('textarea');
                    if (htmlTextArea) {
                        htmlTextArea.value = html_beautify(htmlTextArea.value, {
                            indent_size: 4,
                            extra_liners: []
                        });
                    }
                }
            });
        });
    </script>
</body>

</html>
