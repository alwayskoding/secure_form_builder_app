<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Form Builder - Introductory Page</title>
    <!--and links-->

    <style>
        .full_splash_container {
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.95);
            width: 100%;
            justify-content: center;
            align-items: center;
            padding-top: 40px;
        }


        .text_instruction {
            color: #f5f5f5;
            font-family: Helvetica;
            position: relative;
            left: -167px;
            font-weight: 300;
            top: 80px
        }

        .form_builder_entry_screen {
            display: flex;
            width: 100%;
            justify-content: center;
            align-items: center;
            height: 100vh;
            gap: 100px;
        }

        .build_form_from_scratch,
        .build_form_from_template {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .build_form_from_scratch {
            border-radius: 8px;
            height: 400px;
            border: 2px dotted #f5f5f5;
            width: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .build_form_from_scratch:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        }

        .build_form_from_scratch .inner_plus {
            color: #f5f5f5;
            font-size: 80px;
        }

        .build_form_from_template {
            border-radius: 8px;
            height: 400px;
            border: 2px solid #f5f5f5;
            width: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .build_form_from_template:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        }

        .build_form_from_template .inner_doc_template_example {
            width: 70%;
            height: 70%;
            background-color: #f5f5f5;
            border-radius: 2px;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .inner_doc_template_example {
            position: relative;
            top: 23px;
        }

        .build_form_from_scratch .instructional_text {
            position: relative;
            top: 180px;
            color: #f5f5f5;
            font-family: Helvetica;
            line-height: 1.4;
            text-align: center;
        }

        .build_form_from_template .instructional_text {
            position: relative;
            top: 80px;
            color: #f5f5f5;
            font-family: Helvetica;
            line-height: 1.4;
            text-align: center;
        }

        .inner_top_header_ex {
            width: 100px;
            height: 20px;
            background-color: grey;
            margin-top: 20px;
            border-radius: 2px;
        }

        .description_icon_spot {
            width: 100%;
            height: 30px;
            background-color: darkgrey;
            margin-top: 10px;
            border-radius: 2px;
        }

        .quarter_position_container {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 10px;
        }

        .quarter_position_container .quarter_form_icon {
            width: 33.33%;
            height: 20px;
            background-color: grey;
            border-radius: 2px;
        }

        .three_quarter_one_quarter_container {
            display: flex;
            width: 100%;
            gap: 5px;
            margin-top: 10px;
        }

        .one_quarter_ex,
        .three_quarter_ex {
            background-color: darkgrey;
            height: 20px;
            border-radius: 2px;

        }

        .one_quarter_ex {
            width: 33.33%;
        }

        .three_quarter_ex {
            width: 70%;
        }

        .long_bar_icon {
            width: 100%;
            height: 10px;
            background-color: grey;
            margin-top: 10px;
            border-radius: 2px;
        }

        .button_icon_ex {
            background-color: darkgrey;
            width: 50px;
            height: 15px;
            margin-top: 20px;
            border-radius: 2px;
        }
    </style>
</head>


<body>


    <div class="full_splash_container">
        <div class="text_instruction">
            <h1>Build a Form</h1>
            <p>Create a custom form or choose one from our gallery.</p>
        </div>
        <div class="form_builder_entry_screen">
            <div class="build_form_from_scratch">
                <div class="inner_plus">+</div>
                <div class="instructional_text">
                    <span>Start a custom form from scratch.</span>
                </div>
            </div>
            <div class="build_form_from_template">
                <div class="inner_doc_template_example">
                    <div class="inner_top_header_ex"></div>
                    <div class="description_icon_spot"></div>
                    <div class="quarter_position_container">
                        <div class="quarter_form_icon"></div>
                        <div class="quarter_form_icon"></div>
                        <div class="quarter_form_icon"></div>
                    </div>
                    <div class="three_quarter_one_quarter_container">
                        <div class="one_quarter_ex"></div>
                        <div class="three_quarter_ex"></div>
                    </div>
                    <div class="long_bar_icon"></div>
                    <div class="long_bar_icon"></div>

                    <div class="button_icon_ex"></div>

                </div>
                <div class="instructional_text">
                    <span>Look through our template gallery of premade forms.</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.querySelector('.build_form_from_scratch').addEventListener('click', function () {
            window.location.href = 'index.html#blank';
        });

        document.querySelector('.build_form_from_template').addEventListener('click', function () {
            window.location.href = 'index.html#template';
        });
    </script>


</body>



</html>
