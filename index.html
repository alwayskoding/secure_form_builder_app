                //Recently adjusted to also include the width selector input so user can enter specific width for the inputs themselves
                $(document).ready(function () {
                    // Function to add or remove the Bootstrap toolbar
                    function toggleBootstrapToolbar($field, action) {
                        if (action === 'add') {
                            // Create the toolbar dynamically if it doesn't exist
                            if ($field.find('.bootstrap-toolbar').length === 0) {
                                var $toolbar = $('<div/>', {
                                    'class': 'bootstrap-toolbar',
                                    'css': {
                                        'position': 'absolute',
                                        'z-index': '1000',
                                        'top': '150px',
                                        'left': 0,
                                        'display': 'none',
                                        'background-color': '#2b2a2a',
                                        'border': '1px solid #2b2a2a',
                                        'padding': '20px',
                                        'min-height': '100px'
                                    }
                                });

                                // Add buttons to the toolbar
                                var classes = ['col-md-4', 'col-md-6', 'col-md-8', 'col-md-12'];
                                $.each(classes, function (i, gridClass) {
                                    $('<button/>', {
                                        'class': 'grid-class-btn',
                                        'data-class': gridClass,
                                        'text': '.' + gridClass,
                                        'type': 'button'
                                    }).appendTo($toolbar);
                                });

                                // Check the type of field to decide whether to show the width input
                                var fieldType = $field.find('input').attr('type');
                                var isTextAreaOrSelect = $field.is('.textarea-field, .select-field');

                                // Show width input for text areas, selects, and all other types except radio and checkbox
                                if (fieldType !== 'radio' && fieldType !== 'checkbox' ||
                                    isTextAreaOrSelect) {
                                    // Create width input section
                                    var $widthInput = $('<input/>', {
                                        'type': 'text',
                                        'placeholder': 'e.g., 200px or 80%',
                                        'style': 'margin-left: 10px; width: 100px;'
                                    });
                                    // Append the input to the toolbar
                                    $toolbar.append($widthInput);
                                }

                                // Append the toolbar to the form field
                                $field.css('position', 'relative').append($toolbar);
                                $toolbar.slideDown();
                            }
                        } else if (action === 'remove') {
                            // Remove the toolbar if it exists
                            $field.find('.bootstrap-toolbar').slideUp(function () {
                                $(this).remove();
                            });
                        }
                    }

                    // Observe changes in the style attribute of frm-holder to toggle the Bootstrap toolbar
                    var observer = new MutationObserver(function (mutations) {
                        mutations.forEach(function (mutation) {
                            var $holder = $(mutation.target);
                            var $field = $holder.closest('.form-field');
                            if ($holder.css('display') === 'block') {
                                toggleBootstrapToolbar($field, 'remove');
                            } else {
                                toggleBootstrapToolbar($field, 'add');
                            }
                        });
                    });

                    // Bind mouse enter event to form fields
                    $(document).on('mouseenter', '.form-field', function () {
                        var $holder = $(this).find('.frm-holder');
                        if ($holder.length) {
                            observer.observe($holder[0], {
                                attributes: true,
                                attributeFilter: ['style']
                            });
                        }
                        // Add the toolbar only if the frm-holder is not displayed
                        if ($holder.css('display') !== 'block') {
                            toggleBootstrapToolbar($(this), 'add');
                        }
                    });

                    // Hide and remove the toolbar when the mouse leaves the form field
                    $(document).on('mouseleave', '.form-field', function () {
                        var $holder = $(this).find('.frm-holder');
                        if ($holder.length) {
                            observer.disconnect();
                        }
                        toggleBootstrapToolbar($(this), 'remove');
                    });

                    // Bind input event to the width input

                        var $input = $(this);
                        var $toolbar = $input.closest('.bootstrap-toolbar');
                        var widthValue = $input.val();
                        // Apply width style directly
                        var $inputFields = $toolbar.parent().find('.prev-holder').find(

                        );
                        $inputFields.each(function () {

                        });
                        console.log("Applied width:", widthValue); // Log the applied width
                    });

                        var $target = $(this).closest('.form-field');
                        if ($target.length) {
                            // Remove existing grid classes and add the new class
                            $target.removeClass(function (index, className) {
                                return (className.match(/\bcol-md-\d+\b/g) || []).join(
                                    ' ');
                            }).addClass(gridClass);
                        }
                    });

                    // Ensure the toolbar doesn't disappear when hovering over it
                    $(document).on('mouseenter', '.bootstrap-toolbar', function () {
                        $(this).stop(true).show();
                    });

                    // Handle mouse leave on the toolbar for delayed hide
                    $(document).on('mouseleave', '.bootstrap-toolbar', function () {
                        var $toolbar = $(this);
                        setTimeout(function () {
                            if (!$toolbar.is(':hover')) {
                                $toolbar.slideUp(function () {
                                    $(this).remove();
                                });
                            }
                        }, 1000); // Delay time in milliseconds
                    });
                });















                //End of Update 003 Above

                //Update 004 Allowing Bootstrap Input Sizing Classes To Work
                $(document).ready(function () {
                    // Observe class changes on all .form-control within li.form-field
                    $('li.form-field .form-control').each(function () {
                        var $input = $(this); // Cache the jQuery object of the input

                        // Create an observer instance
                        var observer = new MutationObserver(function (mutations) {
                            mutations.forEach(function (mutation) {
                                if (mutation.attributeName === "class") {
                                    // Check if the input has input-sm or input-lg
                                    if ($input.hasClass('input-sm') || $input
                                        .hasClass('input-lg')) {
                                        // Remove the inline height style if it exists
                                        $input.css('height', '');
                                    }
                                }
                            });
                        });

                        // Observer configuration
                        var config = {
                            attributes: true,
                            attributeFilter: ['class']
                        };

                        // Start observing the target node for configured mutations
                        observer.observe($input[0], config);

                        // Later, you can stop observing like this:
                        // observer.disconnect();
                    });
                });
                //Update 004 - I've updated this to not copy the html anymore but to open a new page and place the copied code there in a left panel and css styles in a right panel to write custom css

                $('#copyHTMLBtn').click(function () {
                    var formData = formBuilder.actions.getData('json', true);

                    if (formData) {
                        $('#render-container').formRender({
                            formData: formData
                        });

                        const html = $('#render-container').formRender('html');
                        const transformedHTML = transformHTML(html);
                        const wrappedContent = wrapContentWithFormTemplate(transformedHTML);

                        // Save the rendered HTML to localStorage
                        localStorage.setItem('renderedHTML', wrappedContent);

                        // Open new window/tab
                        window.open('css-styling.html', '_blank');
                    }
                });


                //Update 004 - copy html button changes to allow for opening new page to add styles there 


                function wrapContentWithFormTemplate(content) {
                    return addAttachmentToForm(content);
                }


            }); //end of jquery wrapper
        } //end of mainScript

        document.addEventListener('DOMContentLoaded', mainScript);
    </script>
